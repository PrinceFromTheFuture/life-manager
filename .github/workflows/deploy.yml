name: Build & Deploy

# Required repo secrets: SSH_HOST, SSH_USER, SSH_KEY, DESK_ENV (`dev` or `prod`).
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Resolve image name (lowercase)
        id: img
        run: echo "name=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push image
        uses: docker/build-push-action@v6
        with:
          context: ./desk
          push: true
          tags: ${{ steps.img.outputs.name }}:latest

      - name: Pull & recreate on server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker pull ${{ steps.img.outputs.name }}:latest
            docker rm -f accountant-desk || true
            docker run -d --name accountant-desk --restart unless-stopped \
              -p 5555:5555 \
              --shm-size=1g \
              -e DESK_ENV='${{ secrets.DESK_ENV }}' \
              -v accountant-desk-auth:/app/.wwebjs_auth \
              -v accountant-desk-cache:/app/.wwebjs_cache \
              ${{ steps.img.outputs.name }}:latest
            docker image prune -f
