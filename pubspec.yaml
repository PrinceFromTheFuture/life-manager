name: shopping_list
description: A personal grocery shopping list — build it, shop it, close it out.
publish_to: 'none'
version: 1.0.3+4

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  sqflite: ^2.3.3
  path: ^1.9.0
  path_provider: ^2.1.4
  image_picker: ^1.1.2
  # Widened deliberately: intl moves in 0.x minors, and pinning to one of them
  # is the usual cause of an unresolvable dependency graph later.
  intl: '>=0.19.0 <0.21.0'
  wakelock_plus: ^1.2.8
  # Expenses default to where you are standing when you log them.
  geolocator: ^13.0.0
  # 5.x pulls geocoding_platform_interface 4, which needs Dart 3.8.
  geocoding: 4.0.0
  # API keys live in the Android Keystore, never in the repo or the APK.
  # 11.x needs Dart 3.8; 10.3.1 still has AndroidOptions.defaultOptions
  # and builds on this machine's Dart 3.7.
  flutter_secure_storage: 10.3.1
  # Vision OCR and OpenRouter calls for receipt scanning.
  http: ^1.2.2
  # Month export goes through the system share sheet, not a path on disk.
  # 13.x needs Dart 3.10; 12.x keeps SharePlus.instance and builds on 3.7.
  share_plus: ^12.0.2
  # Opens a saved place in the Google Maps app.
  url_launcher: ^6.3.2
  archive: ^4.0.9
  flutty_solar_icons: ^1.0.4
  flutter_local_notifications: ^18.0.1
  flutter_timezone: ^4.1.0
  timezone: ^0.10.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  # Lets the whole data layer be tested headlessly, with no emulator.
  sqflite_common_ffi: ^2.3.3

flutter:
  uses-material-design: true

  # Fonts are bundled, never fetched at runtime — the app has to look right
  # standing in a store with no signal.
  fonts:
    # Display. Variable (opsz, wdth, wght); drive it with FontVariation.
    - family: Bricolage
      fonts:
        - asset: assets/fonts/BricolageGrotesque-VF.ttf
    # Body / UI. Variable (wdth, wght).
    - family: Instrument
      fonts:
        - asset: assets/fonts/InstrumentSans-VF.ttf
    # Every price, total, quantity and date.
    - family: SpaceMono
      fonts:
        - asset: assets/fonts/SpaceMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/SpaceMono-Bold.ttf
          weight: 700
